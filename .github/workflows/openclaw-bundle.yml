name: OpenClaw Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'infra/openclaw'
      - 'infra/openclaw/**'
      - 'patches/openclaw/**'
      - 'scripts/build-openclaw-bundle.sh'
      - 'scripts/sync-openclaw.sh'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'infra/openclaw'
      - 'infra/openclaw/**'
      - 'patches/openclaw/**'
      - 'scripts/build-openclaw-bundle.sh'
      - 'scripts/sync-openclaw.sh'
  workflow_dispatch: {}

jobs:
  build:
    name: Build macOS arm64 bundle
    runs-on: macos-14
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'pnpm'
          cache-dependency-path: infra/openclaw/pnpm-lock.yaml

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          pnpm -v

      - name: Patch apply check
        run: ./scripts/sync-openclaw.sh

      - name: Build bundle
        run: |
          OUT_DIR="$RUNNER_TEMP/openclaw-out" ./scripts/build-openclaw-bundle.sh
          ls -la "$RUNNER_TEMP/openclaw-out"

      - name: Prepare stable artifact name
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-dist"
          latest="$(ls -t "$RUNNER_TEMP/openclaw-out"/openclaw-macos-arm64-*.tar.gz | head -1)"
          cp "$latest" "$RUNNER_TEMP/openclaw-dist/openclaw-macos-arm64.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/openclaw-dist/openclaw-macos-arm64.tar.gz" | tee "$RUNNER_TEMP/openclaw-dist/openclaw-macos-arm64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-macos-arm64
          path: |
            ${{ runner.temp }}/openclaw-dist/openclaw-macos-arm64.tar.gz
            ${{ runner.temp }}/openclaw-dist/openclaw-macos-arm64.tar.gz.sha256
