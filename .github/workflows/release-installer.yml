name: Release Installer (lingkong.xyz)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-installer.yml'
      - '.gitmodules'
      - 'apps/gemini_api/**'
      - 'apps/webui/**'
      - 'infra/openclaw'
      - 'infra/openclaw/**'
      - 'infra/whisper.cpp'
      - 'infra/whisper.cpp/**'
      - 'patches/openclaw/**'
      - 'scripts/build-openclaw-bundle.sh'
      - 'scripts/build-whisper-cli-bundle.sh'
      - 'scripts/deploy-to-server.sh'
      - 'scripts/quick-install.sh'
      - 'scripts/sync-openclaw.sh'
  workflow_dispatch: {}

jobs:
  release:
    name: Build + Upload Website Artifacts
    runs-on: macos-14
    env:
      DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER || vars.DEPLOY_SERVER || format('{0}@{1}', secrets.USERNAME || secrets.DEPLOY_USERNAME || secrets.DEPLOY_USER || vars.USERNAME || vars.DEPLOY_USERNAME || vars.DEPLOY_USER, secrets.HOST || secrets.DEPLOY_HOST || vars.HOST || vars.DEPLOY_HOST) }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          pnpm -v

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Support multiple secret naming conventions.
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY || secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          host="${DEPLOY_SERVER#*@}"
          ssh-keyscan -H "${host}" >> ~/.ssh/known_hosts

      - name: Deploy (install.sh + tarballs + static pages)
        run: |
          ./scripts/deploy-to-server.sh
